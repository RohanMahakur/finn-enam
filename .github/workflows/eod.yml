# After-close job: prices → filings → alerts → push → refresh the static snapshot.
# 16:20 IST = 10:50 UTC, Mon–Fri. Also runnable by hand.
name: eod
on:
  schedule: [{ cron: "50 10 * * 1-5" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/cache@v4
        with: { path: data/finn.sqlite, key: "finn-db-${{ github.run_id }}", restore-keys: "finn-db-" }
      - run: pip install -r backend/requirements.txt
      - name: run pipeline
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINN_APP_URL: ${{ vars.FINN_APP_URL }}
        run: |
          python -m finn run --days 3
          python -m finn export
      - name: commit snapshot (triggers the static redeploy)
        run: |
          git config user.name "finn-bot" && git config user.email "finn-bot@users.noreply.github.com"
          git add frontend/public/data && git commit -m "snapshot $(date -u +%F)" || echo "no changes"
          git push
